# Lumen Teleport Lab - gepruefte Plattform.
# Bauen: teleport_analyser_bauen.bat oder gradlew.bat build
# Neue Minecraft-Versionen benoetigen auch eine Pruefung der Mixins und mods.toml.

minecraft_version=1.21.7
# Bereich, in dem Forge die Mod laedt.
minecraft_version_range=[1.21.7,1.22)

forge_version=57.0.3
forge_version_range=[0,)
loader_version_range=[0,)

# Offizielle Mojang-Namen; Version entspricht normalerweise der Minecraft-Version.
mapping_version=1.21.7

java_version=21
# Pruefung der Event-Listener beim Kompilieren (EventBus 7, ab Forge 1.21.6).
eventbus_validator_version=7.0-beta.10
