plugins { id 'net.minecraftforge.gradle' version '6.0.54' }
def platform = new Properties()
rootProject.file('versions/1.21.7.properties').withReader('UTF-8') { platform.load(it) }
base.archivesName = "Lumen-Teleport-Lab-${platform.minecraft_version}"
if (providers.gradleProperty('smoke').isPresent()) sourceSets.main.java.srcDir('src/smoke/java')
minecraft {
    mappings channel: 'official', version: platform.mapping_version
    reobf = false
    copyIdeResources = false
    runs {
        client {
            workingDirectory project.file('run')
            arg '-mixin.config=teleportlab.mixins.json'
            if (providers.gradleProperty('smoke').isPresent()) jvmArg '-Dmixin.debug.export=true'
            mods {
                teleportlab {
                    source sourceSets.main
                    source project(':core').sourceSets.main
                }
            }
        }
    }
}
repositories {
    mavenCentral()
    maven { name = 'Forge'; url = 'https://maven.minecraftforge.net' }
    maven { name = 'Minecraft libraries'; url = 'https://libraries.minecraft.net' }
    exclusiveContent {
        forRepository { maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public' } }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
}
dependencies {
    minecraft "net.minecraftforge:forge:${platform.minecraft_version}-${platform.forge_version}"
    // Embedded in the distribution and in the exploded mod sources below; a separate
    // runtime core.jar would export the same package twice under Java modules.
    compileOnly project(':core')
    annotationProcessor "net.minecraftforge:eventbus-validator:${platform.eventbus_validator_version}"
}
tasks.named('jar', Jar) {
    from project(':core').sourceSets.main.output
    exclude 'dev/lumen/teleportlab/smoke/**'
    manifest.attributes('MixinConfigs': 'teleportlab.mixins.json')
}
// Forge 57 discovers an exploded mod only when its classes and metadata share a root.
sourceSets.each {
    def outputDirectory = layout.buildDirectory.dir("sourceSets/$it.name")
    it.output.resourcesDir = outputDirectory
    it.java.destinationDirectory = outputDirectory
}
